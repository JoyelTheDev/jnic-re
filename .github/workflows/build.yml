name: build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -----------------------------
      # Java
      # -----------------------------
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # -----------------------------
      # Build with Gradle
      # -----------------------------
      - name: Build with Gradle
        run: ./gradlew build

      # -----------------------------
      # Get build number and rename JARs
      # -----------------------------
      - name: Get build number and rename JARs
        id: build_number
        run: |
          LAST_NUM=$(git ls-remote --tags origin | grep -o 'v[0-9]*' | sed 's/v//' | sort -n | tail -n1)
          if [ -z "$LAST_NUM" ]; then
            NEXT_NUM=1
          else
            NEXT_NUM=$((LAST_NUM + 1))
          fi
          echo "next_number=$NEXT_NUM" >> $GITHUB_OUTPUT

          JARS=$(find build/libs -maxdepth 1 -name "*.jar" | grep -v '\-plain\.jar')
          if [ -z "$JARS" ]; then
            echo "❌ ERROR: No JARs found in build/libs/"
            ls -la build/libs/
            exit 1
          fi

          RENAMED=""
          for JAR in $JARS; do
            BASENAME=$(basename "$JAR" .jar)
            # Strip any trailing version like -1.0.0 or -1.0-SNAPSHOT
            STRIPPED=$(echo "$BASENAME" | sed 's/-[0-9][0-9]*\.[0-9].*//')
            NEW_JAR="build/libs/${STRIPPED}-${NEXT_NUM}.jar"
            mv "$JAR" "$NEW_JAR"
            echo "✅ Renamed: $(basename $JAR) → $(basename $NEW_JAR)"
            RENAMED="$RENAMED $NEW_JAR"
          done

          # Trim leading space and store newline-separated for the release step
          echo "JAR_FILES=$(echo $RENAMED | tr ' ' '\n' | tr '\n' ',' | sed 's/,$//')" >> "$GITHUB_ENV"

      # -----------------------------
      # Generate changelog (since last tag)
      # -----------------------------
      - name: Generate changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "## Changes" > CHANGELOG.md
          if [ -z "$LAST_TAG" ]; then
            echo "_Initial release_" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            echo "_Changes since $LAST_TAG_" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log $LAST_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi

      # -----------------------------
      # GitHub Release
      # -----------------------------
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          tag_name: v${{ steps.build_number.outputs.next_number }}
          name: Build ${{ steps.build_number.outputs.next_number }}
          body_path: CHANGELOG.md
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
